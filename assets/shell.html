<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'; img-src data:">
<title>PokeCatch Titlebar</title>
<style>
  /* 窗口层的标题栏：它不属于游戏页面，游戏被放在下面的 WebContentsView 里。
     好处是游戏的视口和浏览器里一模一样（内容区 = 窗口 − 36px），
     不需要再给游戏注入任何布局补偿样式。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 整页必须自己画不透明底色，不能写 transparent。
     窗口一改尺寸时，新露出来的那条边在页面重绘前由窗口原生底色填空；
     页面自己是不透明深色 #141826，第一帧就是深色，不会闪白。标题栏（#tb）仍然画在上面。 */
  html, body {
    width: 100%; height: 100%;
    background: #141826;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body { font-family: "Jersey 15", system-ui, sans-serif; }

  #tb {
    position: absolute;
    inset: 0 0 auto 0;
    height: 36px;
    display: flex;
    align-items: center;
    background: #1a1e2c;
    border-bottom: 1px solid #333a52;
    /* 拖拽：整条标题栏都是窗口拖动区；按钮区显式排除。
       不要在这条链上加 filter / transform / opacity<1 / backdrop-filter，
       会生成独立合成层，破坏 drag region 命中。 */
    -webkit-app-region: drag;
    app-region: drag;
  }
  html.fs #tb { display: none; }

  #tb .brand {
    display: flex; align-items: center; gap: 7px;
    padding: 0 12px; height: 100%;
    color: #eef1f8; font-size: 15px; letter-spacing: .5px;
    -webkit-app-region: drag; app-region: drag;
  }
  #tb .brand svg { width: 20px; height: 20px; display: block; pointer-events: none; }
  #tb .spacer { flex: 1; height: 100%; -webkit-app-region: drag; app-region: drag; }

  #tb .tools {
    display: flex; height: 100%; align-items: center;
    -webkit-app-region: no-drag; app-region: no-drag;
  }
  #tb .tools button {
    width: 36px; height: 100%;
    border: 0; background: transparent;
    color: #8892ad; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .12s ease, color .12s ease;
  }
  #tb .tools button:hover { background: #252a3d; color: #eef1f8; }
  #tb .tools button.active-pin { color: #2b8cff; }
  #tb .tools button.active-mute { color: #ffcb05; }
  #tb .tools svg { width: 15px; height: 15px; display: block; }
  #tb .sep {
    width: 1px; height: 16px;
    background: #333a52;
    margin: 0 2px;
    flex: none;
  }

  #tb .controls { display: flex; height: 100%; -webkit-app-region: no-drag; app-region: no-drag; }
  #tb .controls button {
    width: 44px; height: 100%;
    border: 0; background: transparent;
    color: #9aa3bb; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .12s ease, color .12s ease;
  }
  #tb .controls button:hover { background: #252a3d; color: #eef1f8; }
  #tb .controls button.close:hover { background: #e3353b; color: #fff; }
  #tb .controls svg { width: 15px; height: 15px; display: block; }
</style>
</head>
<body>
  <div id="tb">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><clipPath id="plbClip"><circle cx="32" cy="32" r="25.5"/></clipPath></defs>
        <circle cx="32" cy="32" r="27.5" fill="none" stroke="#1b1b22" stroke-width="4"/>
        <g clip-path="url(#plbClip)">
          <rect x="0" y="0" width="64" height="32" fill="#e3353b"/>
          <rect x="0" y="32" width="64" height="32" fill="#f8f8f8"/>
          <rect x="0" y="29.96" width="64" height="4.08" fill="#1b1b22"/>
        </g>
        <circle cx="32" cy="32" r="11.2" fill="#1b1b22"/>
        <circle cx="32" cy="32" r="8.3" fill="#f8f8f8"/>
      </svg>
      <span>Poke'Catch</span>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <button data-a="mute" title="静音 (Ctrl+M)" aria-label="静音" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2.5 6h2.7l3.3-2.8v9.6L5.2 10H2.5V6Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M11 5.6a3.4 3.4 0 0 1 0 4.8M12.9 3.8a6 6 0 0 1 0 8.4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
      </button>
      <button data-a="pin" title="窗口置顶" aria-label="窗口置顶" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none"><path d="M5.5 2.5h5l-.8 4.2 2.3 2v1H8.7v3.8l-.7 1-.7-1V9.7H4v-1l2.3-2-.8-4.2Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
    </div>
    <div class="controls">
      <button data-a="min" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
      </button>
      <button data-a="max" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button data-a="close" class="close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
      </button>
    </div>
  </div>
  <script>
    (() => {
      const L = window.launcher;
      if (!L) return;
      const q = (sel) => document.querySelector(sel);
      const tb = q('#tb');
      const pinBtn = q('[data-a="pin"]');
      const muteBtn = q('[data-a="mute"]');
      const minBtn = q('[data-a="min"]');
      const maxBtn = q('[data-a="max"]');
      const closeBtn = q('[data-a="close"]');

      const ICON_MAX = '<svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
      const ICON_RESTORE = '<svg viewBox="0 0 12 12"><rect x="1.2" y="3.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.6 3.2V1.2h7.2v7.2H9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
      const ICON_SOUND = '<svg viewBox="0 0 16 16" fill="none"><path d="M2.5 6h2.7l3.3-2.8v9.6L5.2 10H2.5V6Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M11 5.6a3.4 3.4 0 0 1 0 4.8M12.9 3.8a6 6 0 0 1 0 8.4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>';
      const ICON_MUTED = '<svg viewBox="0 0 16 16" fill="none"><path d="M2.5 6h2.7l3.3-2.8v9.6L5.2 10H2.5V6Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M10.6 5.6l3.4 4.8M14 5.6l-3.4 4.8" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/></svg>';

      if (pinBtn) pinBtn.addEventListener('click', () => L.togglePin());
      if (muteBtn) muteBtn.addEventListener('click', () => L.toggleMute());
      if (minBtn) minBtn.addEventListener('click', () => L.minimize());
      if (maxBtn) maxBtn.addEventListener('click', () => L.maximize());
      if (closeBtn) closeBtn.addEventListener('click', () => L.close());
      if (tb) {
        tb.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (typeof L.openTitleMenu === 'function') L.openTitleMenu();
        });
      }

      const applyMaxState = (isMax) => {
        if (!maxBtn) return;
        maxBtn.innerHTML = isMax ? ICON_RESTORE : ICON_MAX;
        maxBtn.title = isMax ? '还原' : '最大化';
      };

      const applyShellState = (state) => {
        if (!state || typeof state !== 'object') return;
        if (pinBtn && typeof state.alwaysOnTop === 'boolean') {
          pinBtn.classList.toggle('active-pin', state.alwaysOnTop);
          pinBtn.setAttribute('aria-pressed', state.alwaysOnTop ? 'true' : 'false');
          pinBtn.title = state.alwaysOnTop ? '取消窗口置顶' : '窗口置顶';
        }
        if (muteBtn && typeof state.muted === 'boolean') {
          muteBtn.classList.toggle('active-mute', state.muted);
          muteBtn.setAttribute('aria-pressed', state.muted ? 'true' : 'false');
          muteBtn.innerHTML = state.muted ? ICON_MUTED : ICON_SOUND;
          muteBtn.title = state.muted ? '取消静音 (Ctrl+M)' : '静音 (Ctrl+M)';
        }
      };

      if (typeof L.isMaximized === 'function') L.isMaximized().then(applyMaxState).catch(() => {});
      if (typeof L.onMaximizeChange === 'function') L.onMaximizeChange(applyMaxState);
      if (typeof L.getShellState === 'function') L.getShellState().then(applyShellState).catch(() => {});
      if (typeof L.onShellState === 'function') L.onShellState(applyShellState);
    })();
  </script>
</body>
</html>
