name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm 11 的 install-scripts 安全策略可能跳过 Electron 的 postinstall；
      # electronDist 指向这份本地分发，发布前显式确保它已下载。
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
