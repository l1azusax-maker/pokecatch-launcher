<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'; img-src data:">
  <title>插件更新 · Poke'Catch</title>
  <style>
    @font-face {
      font-family: "Jersey 15";
      src: url("jersey-15.woff2") format("woff2");
      font-display: swap;
    }
    @font-face {
      font-family: "Jersey 10";
      src: url("jersey-10.woff2") format("woff2");
      font-display: swap;
    }
    /* 与游戏内设置面板完全一致的设计令牌
       （.modal.gd-modal.opt-modal 的强调色就是 --blue-vivid #2b8cff） */
    :root {
      --c: #2b8cff;
      --panel: #1c2030;
      --panel-2: #252a3d;
      --panel-3: #2e3550;
      --line: #333a52;
      --sunken: #10131f;
      --text: #eef1f8;
      --text-2: #c3c9d8;
      --muted: #9aa3bb;
      --ink: #1b1b22;
      --red: #e3353b;
      --yellow: #ffcb05;
      --blue-vivid: #2b8cff;
      --green: #4cc96a;
      --font: "Jersey 10", system-ui, sans-serif;
      --font-title: "Jersey 15", system-ui, sans-serif;
      --fs-body: 18px;
      --fs-sm: 16px;
      --fs-caption: 14px;
      --fs-micro: 13px;
      --r-sm: 10px;
      --r-md: 14px;
      --ease: .15s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: transparent; }
    /* 直角窗口：背景/边框画在 .card 上，不再做圆角（窗口本身也不透明，
       省掉透明窗口那层 alpha 合成）。 */
    .card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      overflow: hidden;
      box-shadow: inset 0 0 0 2px var(--line);
    }
    body {
      color: var(--text);
      font-family: var(--font);
      font-size: var(--fs-body);
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    /* 头部：对齐游戏里的 .dc-head（强调色渐变 + 2px 底线） */
    .head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 8px 12px 8px 14px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--c) 42%, transparent), transparent 78%);
      border-bottom: 2px solid color-mix(in srgb, var(--c) 55%, var(--line));
      -webkit-app-region: drag;
    }
    .head .ic {
      width: 26px; height: 26px;
      flex: none;
      display: block;
      image-rendering: pixelated;
    }
    .head h2 {
      font-family: var(--font-title);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .head .sp { flex: 1; }

    /* 关闭键：游戏里的 .dc-x */
    .dc-x {
      position: relative;
      flex: none;
      width: 32px; height: 32px;
      padding: 0;
      border-radius: var(--r-sm);
      background: var(--panel-2);
      border: 2px solid color-mix(in srgb, var(--red) 72%, transparent);
      color: color-mix(in srgb, var(--red) 78%, #fff);
      cursor: pointer;
      transition: background var(--ease), border-color var(--ease);
      -webkit-app-region: no-drag;
      display: grid;
      place-items: center;
    }
    .dc-x:hover { background: color-mix(in srgb, var(--red) 18%, var(--panel-2)); border-color: var(--red); }
    .dc-x:active { transform: translateY(1px); }
    .dc-x svg { width: 12px; height: 12px; display: block; }

    /* 正文 */
    .body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 16px 0;
      text-align: center;
    }
    .headline {
      display: flex;
      /* 用 center 而不是 baseline：数字是 24px 的 Jersey 15、正文是 Jersey 10，
         两者的基线不同，baseline 对齐会让数字明显偏高（实测差 2px）。 */
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: var(--fs-body);
      font-weight: 700;
      color: var(--text);
    }
    .headline .count {
      font-family: var(--font-title);
      font-size: 24px;
      line-height: 1;
      color: var(--c);
    }
    .desc { font-size: var(--fs-caption); color: var(--muted); }

    /* 文件行：游戏里的 .op-card */
    .op-card {
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 6px 12px;
      margin-top: 2px;
      background: var(--panel-2);
      border: 2px solid color-mix(in srgb, var(--c) 35%, var(--line));
      border-radius: var(--r-md);
      overflow: hidden;
      text-align: left;
    }
    .op-card .dot {
      width: 8px; height: 8px;
      flex: none;
      border-radius: 50%;
      /* 像素字体的字形在行框内偏下，盒子居中了但看着偏高 —— 往下挪 1px 对齐视觉中心 */
      transform: translateY(1px);
      background: var(--green);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 25%, transparent);
    }
    .op-card .list {
      flex: 1;
      min-width: 0;
      font-size: var(--fs-caption);
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .op-card .list .ver { color: var(--muted); }

    /* 按钮：游戏 .btn（渐变 + inset 底影），主按钮用 gold */
    .footer {
      flex: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 16px 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 14px;
      border: 2px solid transparent;
      border-radius: var(--r-sm);
      font-family: var(--font);
      font-size: var(--fs-sm);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color var(--ease), background var(--ease), transform .08s;
    }
    .btn:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
    .btn.primary {
      color: #fff;
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--c) 78%, var(--panel)),
        color-mix(in srgb, var(--c) 42%, var(--panel)));
      border-color: color-mix(in srgb, var(--c) 72%, transparent);
      box-shadow: inset 0 -3px #00000040;
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--text-2);
      font-weight: 600;
    }
    .btn.ghost:hover { background: var(--panel-2); border-color: var(--panel-3); color: var(--text); }
    .btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="card">
  <div class="head">
    <svg class="ic" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
      <defs><clipPath id="psbClip"><circle cx="32" cy="32" r="25.5"/></clipPath></defs>
      <circle cx="32" cy="32" r="27.5" fill="none" stroke="#1b1b22" stroke-width="4"/>
      <g clip-path="url(#psbClip)">
        <rect x="0" y="0" width="64" height="32" fill="#e3353b"/>
        <rect x="0" y="32" width="64" height="32" fill="#f8f8f8"/>
        <rect x="0" y="29.96" width="64" height="4.08" fill="#1b1b22"/>
      </g>
      <circle cx="32" cy="32" r="11.2" fill="#1b1b22"/>
      <circle cx="32" cy="32" r="8.3" fill="#f8f8f8"/>
    </svg>
    <h2 id="docTitle">插件更新</h2>
    <span class="sp"></span>
    <button id="btn-close" class="dc-x" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
    </button>
  </div>

  <div class="body">
    <div class="headline"><span class="count" id="count">0</span><span id="headlineText">个插件已更新，是否刷新？</span></div>
    <div class="desc">刷新后新版本插件才会生效</div>
    <div class="op-card">
      <span class="dot"></span>
      <span class="list" id="files"></span>
    </div>
  </div>

  <div class="footer">
    <button class="btn primary" id="btn-ok">确认刷新</button>
    <button class="btn ghost" id="btn-cancel">取消</button>
  </div>
  </div><!-- /.card -->

  <script>
    (function () {
      // 主进程通过 loadFile 的 query 传入 { count, items[] }
      var data = { count: 0, items: [] };
      try {
        var raw = new URLSearchParams(location.search).get('d');
        if (raw) data = JSON.parse(raw);
      } catch (_) {}

      var isImport = data.kind === 'import';

      var count = Number(data.count) || (data.items || []).length || 0;
      document.getElementById('count').textContent = String(count);

      document.getElementById('headlineText').textContent = isImport ? '个插件已导入，是否刷新？' : '个插件已更新，是否刷新？';
      document.getElementById('docTitle').textContent = isImport ? '插件导入' : '插件更新';
      document.title = isImport ? '插件导入 · Poke\'Catch' : '插件更新 · Poke\'Catch';

      var items = data.items || [];
      var names = items.map(function (it) {
        var base = String(it.name || '').replace(/\.user\.js$/i, '').replace(/\.js$/i, '');
        var ver = it.to ? (it.from && it.from !== it.to ? ' ' + it.from + '→' + it.to : ' v' + it.to) : '';
        return base + ver;
      });
      var listEl = document.getElementById('files');
      listEl.textContent = names.join(' · ');
      listEl.title = items.map(function (it) { return it.name; }).join('\n');

      function act(action) {
        try { window.launcher.noticeAction(action); } catch (_) {}
      }
      document.getElementById('btn-ok').addEventListener('click', function () { act('refresh'); });
      document.getElementById('btn-cancel').addEventListener('click', function () { act('cancel'); });
      document.getElementById('btn-close').addEventListener('click', function () { act('cancel'); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { e.preventDefault(); act('cancel'); }
        else if (e.key === 'Enter') { e.preventDefault(); act('refresh'); }
      });
    })();
  </script>
</body>
</html>
