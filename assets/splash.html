<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>加载中…</title>
  <style>
    :root {
      --red: #e3353b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      position: fixed;
      inset: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 精灵球：只有球本身，外面不再套虚线圆环 */
    .ball-wrap {
      position: relative;
      width: 132px;
      height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 地面投影单独一层：球在转，影子不能跟着转（所以不用 box-shadow 的模糊投影，
       只保留球体那一圈对称描边）。影子完全静止，球心坐标不变。 */
    .ball-shadow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 11px;
      margin-left: -27px;
      margin-top: 40px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .42) 0%, rgba(0, 0, 0, .2) 52%, rgba(0, 0, 0, 0) 72%);
      filter: blur(3px);
    }

    .ball-core {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background:
        linear-gradient(to bottom,
          var(--red) 0%, var(--red) 46%,
          #1b1b22 46%, #1b1b22 54%,
          #f8f8f8 54%, #f8f8f8 100%);
      position: relative;
      box-shadow: 0 0 0 3px #1b1b22;
      will-change: transform;
      /* 绕球心左右晃动，不位移。三段「压到极限 → 回弹 → 收住」，幅度逐段递减；
         0–66% 摇晃（1.32s）、66–100% 停顿（0.68s），整轮 2s。
         晃动时带一点点放大（每一下压到极限时最大 ~6%，换段时保留 1–2% 的底，
         直到停顿才完全回到 1）—— 缩放原点同样是球心，所以球心依旧不动。
         缓动带一点过冲（ease-out 偏重），摇起来是「啪、啪、啪」的脆感。 */
      animation: ball-wobble 2s cubic-bezier(.36, .07, .19, .97) infinite;
      transform-origin: 50% 50%;
    }
    .ball-core::before {
      content: "";
      position: absolute;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid #1b1b22;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes ball-wobble {
      /* 第一段：往左压，回弹收住（顶点放大到 1.06） */
      0%    { transform: rotate(0deg) scale(1); }
      3.5%  { transform: rotate(-24deg) scale(1.06); }
      8.5%  { transform: rotate(19deg) scale(1.045); }
      12.5% { transform: rotate(-12deg) scale(1.03); }
      17.5% { transform: rotate(7deg) scale(1.02); }
      22%   { transform: rotate(-3deg) scale(1.015); }
      25.5% { transform: rotate(0deg) scale(1.02); }
      /* 第二段：往右压，回弹收住 */
      30%   { transform: rotate(24deg) scale(1.06); }
      34.5% { transform: rotate(-19deg) scale(1.045); }
      39%   { transform: rotate(12deg) scale(1.03); }
      44%   { transform: rotate(-7deg) scale(1.02); }
      48%   { transform: rotate(3deg) scale(1.015); }
      52.5% { transform: rotate(0deg) scale(1.018); }
      /* 第三段：幅度收小，像要停住（放大也跟着收） */
      56.5% { transform: rotate(-17deg) scale(1.04); }
      59.5% { transform: rotate(13deg) scale(1.03); }
      63.5% { transform: rotate(-7deg) scale(1.012); }
      66%   { transform: rotate(0deg) scale(1); }
      /* 停一下：完全恢复原尺寸 */
      100%  { transform: rotate(0deg) scale(1); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ball-wrap">
      <div class="ball-shadow"></div>
      <div class="ball-core"></div>
    </div>
  </div>
</body>
</html>
