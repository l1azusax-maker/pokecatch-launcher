<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'; img-src data:">
  <title>PokeCatch Menu</title>
  <style>
    @font-face {
      font-family: "Jersey 10";
      src: url("jersey-10.woff2") format("woff2");
      font-display: swap;
    }
    :root {
      --c: #2b8cff;
      --panel: #1c2030;
      --panel-2: #252a3d;
      --panel-3: #2e3550;
      --line: #333a52;
      --text: #eef1f8;
      --text-2: #c3c9d8;
      --muted: #9aa3bb;
      --red: #e3353b;
      --green: #4cc96a;
      --font: "Jersey 10", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--panel);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 6px;
      background: var(--panel);
      box-shadow: inset 0 0 0 2px var(--line);
    }
    .item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text-2);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .02em;
      cursor: pointer;
      text-align: left;
      transition: background-color .12s ease, color .12s ease, border-color .12s ease;
    }
    .item:hover {
      background: var(--panel-2);
      border-color: color-mix(in srgb, var(--c) 32%, var(--line));
      color: var(--text);
    }
    .item:active {
      background: var(--panel-3);
    }
    .item .ic {
      width: 15px;
      height: 15px;
      flex: none;
      color: var(--muted);
      transition: color .12s ease;
    }
    .item:hover .ic { color: var(--text); }
    .item.on .ic { color: var(--c); }
    .item .label {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sw {
      position: relative;
      width: 28px;
      height: 16px;
      flex: none;
      border-radius: 999px;
      background: #141826;
      border: 1px solid var(--line);
      transition: background-color .15s ease, border-color .15s ease;
    }
    .sw::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform .15s ease, background-color .15s ease;
    }
    .item.on .sw {
      background: color-mix(in srgb, var(--c) 35%, #141826);
      border-color: color-mix(in srgb, var(--c) 80%, var(--line));
    }
    .item.on .sw::after {
      transform: translateX(12px);
      background: #fff;
    }
    .sep {
      height: 1px;
      margin: 4px 6px;
      background: var(--line);
      flex: none;
    }
    .item.danger {
      color: #f3a6a9;
    }
    .item.danger .ic {
      color: #e66a6f;
    }
    .item.danger:hover {
      background: color-mix(in srgb, var(--red) 24%, var(--panel-2));
      border-color: color-mix(in srgb, var(--red) 68%, transparent);
      color: #fff;
    }
    .item.danger:hover .ic {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="menu" role="menu">
    <button class="item" data-act="refresh-clean" role="menuitem">
      <svg class="ic" viewBox="0 0 16 16" fill="none"><path d="M13.2 8a5.2 5.2 0 1 1-1.4-3.5M13.2 2.8v2.7h-2.7" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">刷新并清理内存</span>
    </button>
    <div class="sep" role="separator"></div>
    <button class="item" data-act="keep-active" data-key="keepActive" role="menuitemcheckbox" aria-checked="true">
      <svg class="ic" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v3.2l2.1 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">最小化保持在线</span>
      <span class="sw" aria-hidden="true"></span>
    </button>
    <button class="item" data-act="minimize-to-tray" data-key="minimizeToTray" role="menuitemcheckbox" aria-checked="false">
      <svg class="ic" viewBox="0 0 16 16" fill="none"><path d="M2.5 9.5v3a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3M8 2.5v7M5.5 7l2.5 2.5L10.5 7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">关闭到托盘</span>
      <span class="sw" aria-hidden="true"></span>
    </button>
    <button class="item" data-act="mute" data-key="muted" role="menuitemcheckbox" aria-checked="false">
      <svg class="ic" viewBox="0 0 16 16" fill="none"><path d="M2.5 6h2.7l3.3-2.8v9.6L5.2 10H2.5V6Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M10.8 5.6l3 4.8M13.8 5.6l-3 4.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="label">游戏静音</span>
      <span class="sw" aria-hidden="true"></span>
    </button>
    <button class="item" data-act="pin" data-key="alwaysOnTop" role="menuitemcheckbox" aria-checked="false">
      <svg class="ic" viewBox="0 0 16 16" fill="none"><path d="M5.5 2.5h5l-.8 4.2 2.3 2v1H8.7v3.8l-.7 1-.7-1V9.7H4v-1l2.3-2-.8-4.2Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg>
      <span class="label">游戏置顶</span>
      <span class="sw" aria-hidden="true"></span>
    </button>
    <div class="sep" role="separator"></div>
    <button class="item danger" data-act="quit" role="menuitem">
      <svg class="ic" viewBox="0 0 16 16" fill="none"><path d="M8 2.2v5.3M4.8 4.2a5.2 5.2 0 1 0 6.4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="label">退出游戏</span>
    </button>
  </div>
  <script>
    (() => {
      const api = window.trayMenu;
      if (!api) return;

      const applyState = (state) => {
        if (!state || typeof state !== 'object') return;
        document.querySelectorAll('.item[data-key]').forEach((btn) => {
          const key = btn.getAttribute('data-key');
          const on = Boolean(state[key]);
          btn.classList.toggle('on', on);
          btn.setAttribute('aria-checked', on ? 'true' : 'false');
        });
      };

      document.querySelectorAll('.item[data-act]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const act = btn.getAttribute('data-act');
          if (act) api.action(act);
        });
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          api.close();
        }
      });

      api.getState().then(applyState).catch(() => {});
      api.onState(applyState);
    })();
  </script>
</body>
</html>
